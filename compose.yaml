# Postgres for development and tests (docs/job-workers-todo.md, decision 13, local Postgres).
# Docker Compose reads the POSTGRES_* settings from .env. Start it with
# `docker compose up -d`; it listens on 127.0.0.1 only, on POSTGRES_PORT.
services:
  postgres:
    image: postgres:18
    command: ["postgres", "-c", "max_connections=300"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DATABASE:?Set POSTGRES_DATABASE in .env}
    ports:
      - "${POSTGRES_HOST:?Set POSTGRES_HOST in .env}:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
